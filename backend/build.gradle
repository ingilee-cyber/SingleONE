plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.5'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.singleone'
version = '0.0.1-SNAPSHOT'

// Spring Boot 3.1.5가 관리하는 Testcontainers 1.18.3은 최신 Docker Desktop과 named pipe
// 프로토콜이 맞지 않아 연결에 실패한다 (PRD가 지정한 것은 "Testcontainers" 사용 여부이지
// 특정 버전이 아니므로, 이 라이브러리만 Spring Boot BOM의 관리 버전을 오버라이드한다).
ext['testcontainers.version'] = '1.21.3'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'

	// ClickHouse는 Spring Data JPA/Hibernate 대상이 아니며, 별도 JdbcTemplate/DataSource로만 연결한다.
	implementation 'com.clickhouse:clickhouse-jdbc:0.9.0:all'

	runtimeOnly 'com.mysql:mysql-connector-j'

	// 업로드 파일 파싱 (PRD 11.1/11.11: CSV/XLSX, Streaming 방식). PRD가 특정 라이브러리를
	// 지정하지 않아, 대용량 XLSX를 메모리에 전체 적재하지 않고 읽을 수 있는 조합을 사용한다.
	implementation 'org.apache.commons:commons-csv:1.14.1'
	implementation 'org.apache.poi:poi-ooxml:5.4.1'
	implementation 'com.github.pjfanning:excel-streaming-reader:5.1.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Testcontainers 버전은 Spring Boot 3.1.5의 dependency management(1.18.3)를 따른다.
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testImplementation 'org.testcontainers:clickhouse'
	testImplementation 'com.clickhouse:clickhouse-jdbc:0.9.0:all'
}

tasks.named('test') {
	useJUnitPlatform()
}
